[package]
name = "voice-invoker-native"
version = "2.0.0-alpha.1"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
libloading = "0.8"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
cpal = "=0.15.3"

[profile.release]
lto = "thin"
strip = true
