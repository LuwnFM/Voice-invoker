[package]
name = "voice-invoker-native"
version = "2.0.0-alpha.1"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
libloading = "0.8"
hound = "3.5"
tempfile = "3.23"
notify = "8.2"
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"]
tokio-stream = { version = "0.1", features = ["sync"] } }

[target.'cfg(windows)'.dependencies]
cpal = "=0.15.3"
winreg = "0.55"
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
strip = true
