name: Rust native checks
on:
  push:
    branches: [rust-native-2.0]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - name: Verify committed dependency lock
        run: cargo metadata --locked --format-version 1 --no-deps
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Differential replay against 1.1.1
        run: node scripts/parity.cjs
      - name: Native Windows hook lifecycle (observe only)
        if: runner.os == 'Windows'
        run: .\target\release\voice-invoker-native.exe hook-smoke
      - name: Native Win32 overlay and tray host lifecycle
        if: runner.os == 'Windows'
        run: .\target\release\voice-invoker-native.exe shell-smoke
      - name: GSI loopback integration
        run: python scripts/gsi-smoke.py
      - name: Native Vosk with verified V2 (16/48 kHz)
        run: python scripts/native-smoke.py
      - name: Install NSIS 3.11 if absent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'NSIS\makensis.exe'
          if (-not (Test-Path $nsis)) {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
      - name: Build native standalone installer
        if: runner.os == 'Windows'
        run: python scripts/package-windows.py
      - name: Test native standalone installation, repair and uninstall
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: python scripts/installer-smoke.py
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Windows'
        with:
          name: rust-native-installer
          path: |
            rust-native/build-output/VoiceInvoker-Native-Setup-*.exe
            rust-native/build-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: rust-native-build
          path: |
            rust-native/Cargo.lock
            rust-native/target/release/voice-invoker-native.exe
            rust-native/src/
            rust-native/tests/
          if-no-files-found: warn
