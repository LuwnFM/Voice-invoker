name: Rust Anything migration analysis
on:
  push:
    branches: [rust-native-2.0]
    paths:
      - '.github/workflows/rust-migration-analysis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ff689524fa1d9a7ef3aa041fd408f38dc7c1e2c1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned Rust Anything CLI (analysis only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rust-anything-report"
          npm exec --yes --package rust-anything@4.1.0 -- rust-anything --version
          npm exec --yes --package rust-anything@4.1.0 -- rust-anything analyze . --whole-app --json > "$RUNNER_TEMP/rust-anything-report/analysis.json"
          python -m json.tool "$RUNNER_TEMP/rust-anything-report/analysis.json" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: rust-anything-migration-plan
          path: ${{ runner.temp }}/rust-anything-report/analysis.json
