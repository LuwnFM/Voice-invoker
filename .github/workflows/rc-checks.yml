name: RC checks
on:
  push:
    branches: [main, voice-dictionary-setup, rc2-model-download, timing-profiles, prepare-prefixes, rc5-install-lifecycle, rc6-instance-lifecycle]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-runtime.js
      - name: Native hook shutdown smoke test
        shell: pwsh
        run: |
          node -e "const r=require('node:child_process').spawnSync('node_modules/electron/dist/electron.exe',['scripts/hook-smoke.js'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit',timeout:60000});if(r.error)console.error(r.error);process.exit(r.status===0?0:1)"
          if ($LASTEXITCODE -ne 0) { throw 'Native hook smoke test failed' }
      - name: Dependency audit (report only)
        run: npm audit --json
        continue-on-error: true
      - run: npm test
      - name: Check application JavaScript and inline scripts
        shell: pwsh
        run: |
          Get-ChildItem -Path . -File -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $_" }
          }
          node -e "const fs=require('node:fs');for(const f of ['overlay.html','settings.html'])for(const m of fs.readFileSync(f,'utf8').matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g))if(m[1].trim())new Function(m[1]);"
          if ($LASTEXITCODE -ne 0) { throw 'Inline script syntax check failed' }
      - name: Check PowerShell installer syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'setup-dota.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'Invalid installer syntax' }
      - name: Check installed dependencies
        run: npm ls --depth=0

      - name: Download and verify the actual V2 archive
        run: node scripts/fetch-model.js model
      - name: Full Electron lifecycle check
        run: node scripts/lifecycle-check.js
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: invoker-v2
          path: model/vosk-model-small-ru-invoker.tar.gz
          if-no-files-found: error
          retention-days: 2

  publish-rc:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: invoker-v2
          path: model
      - name: Verify release model
        run: node scripts/fetch-model.js model
      - name: Publish release candidate with model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$tag" != "v1.1.0-rc.6" ]]; then exit 0; fi
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]] || exit 0
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; not overwriting."
            exit 0
          fi
          gh release create "$tag" model/vosk-model-small-ru-invoker.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Voice Invoker 1.1.0-rc.6" --notes-file RELEASE_NOTES.md
