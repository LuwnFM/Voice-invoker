name: RC checks
on:
  push:
    branches: [main, voice-dictionary-setup, rc2-model-download, timing-profiles, prepare-prefixes, rc5-install-lifecycle, rc6-instance-lifecycle, rc7-diagnostics-controls]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-runtime.js
      - name: Native hook shutdown smoke test
        shell: pwsh
        run: |
          node -e "const r=require('node:child_process').spawnSync('node_modules/electron/dist/electron.exe',['scripts/hook-smoke.js'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit',timeout:60000});if(r.error)console.error(r.error);process.exit(r.status===0?0:1)"
          if ($LASTEXITCODE -ne 0) { throw 'Native hook smoke test failed' }
      - name: Dependency audit (moderate or higher blocks release)
        run: npm audit --audit-level=moderate
      - run: npm test
      - name: Check application JavaScript and inline scripts
        shell: pwsh
        run: |
          Get-ChildItem -Path . -File -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $_" }
          }
          node -e "const fs=require('node:fs');for(const f of ['overlay.html','settings.html'])for(const m of fs.readFileSync(f,'utf8').matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g))if(m[1].trim())new Function(m[1]);"
          if ($LASTEXITCODE -ne 0) { throw 'Inline script syntax check failed' }
      - name: Check PowerShell installer syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @(Get-ChildItem -Path . -File -Filter *.ps1) + @(Get-ChildItem -Path scripts -File -Filter *.ps1)) {
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "Invalid syntax: $script" }
          }
      - name: Check installed dependencies
        run: npm ls --depth=0

      - name: Download and verify the actual V2 archive
        run: node scripts/fetch-model.js model
      - name: Full Electron lifecycle check
        run: node scripts/lifecycle-check.js
      - name: Build and verify single Windows installer
        if: matrix.node == '22'
        shell: powershell
        run: |
          if (-not (Test-Path (Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'NSIS\makensis.exe'))) {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          .\scripts\build-windows.ps1 -Installer
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: windows-packages
          path: |
            build-output/VoiceInvoker-Setup-*.exe
            build-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish-rc:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: windows-packages
      - name: Verify Windows package checksums
        run: cd windows-packages && sha256sum --check SHA256SUMS.txt
      - name: Publish single Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$tag" != "v1.1.1" ]]; then exit 0; fi
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]] || exit 0
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; not overwriting."
            exit 0
          fi
          installer="windows-packages/VoiceInvoker-Setup-1.1.1.exe"
          test -f "$installer"
          cp RELEASE_NOTES.md release-notes.txt
          printf '\n## SHA-256\n\n```text\n' >> release-notes.txt
          cat windows-packages/SHA256SUMS.txt >> release-notes.txt
          printf '```\n' >> release-notes.txt
          gh release create "$tag" "$installer" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Voice Invoker 1.1.1 (verification build)" --notes-file release-notes.txt
